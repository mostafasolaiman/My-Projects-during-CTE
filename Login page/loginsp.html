<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="./resources/css/style.css" rel="stylesheet">
    <title>Página de inicio de sesión - Thalamus</title>
</head>
<body>
    <header>
        <h1>Bienvenido a <span>THALAMUS</span></h1>
    </header>
    <section class="first">
        <div>
            <label id="name">
                <p>Nombre de usuario o correo electrónico</p>
                <input type="text" minlength="6" style="width: 100%; padding: 5px; border: 1px solid white; border-radius: 5px; box-sizing: border-box;" required>
            </label>
        </div>
        <div>
            <label id="pass">
                <p>Contraseña</p>
                <input type="password" minlength="6" maxlength="15" style="width: 100%; padding: 5px; border: 1px solid white; border-radius: 5px; box-sizing: border-box;" required>
            </label>
        </div>
    </section>
    <section class="second">
        <div>
            <label class="check">
                <input type="checkbox"><p>Mantenerme conectado</p>
            </label>
        </div>
        <div class="forgot">
            <p><a href="#">¿Olvidaste tu contraseña?</a></p>
        </div>
    </section>
    <section class="third">
        <div>
            <button class="btn">
                <p><a href="#">Iniciar sesión</a></p>
            </button>
        </div>
    </section>
    <section class="fourth">
        <div id="en">
            <p><a href="login.html">Inglesa</a></p>
        </div>
        <div id="ar">
            <p><a href="loginar.html">árabe</a></p>
        </div>
    </section>
</body>
</html>
