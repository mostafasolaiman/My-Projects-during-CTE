<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="./resources/css/style.css" rel="stylesheet">
    <title>Login page for Thalamus</title>
</head>
<body>
    <header>
        <h1>Welcome to <span>THALAMUS</span></h1>
    </header>
    <section class="first">
        <div>
            <label id="name">
                <p>Username or Email</p>
                <input type="password" minlength="6" style="width: 100%; padding: 5px; border: 1px solid white; border-radius: 5px; box-sizing: border-box;" required>            
            </label>
        </div>
        <div>
            <label id="pass">
                <p>Password</p>
                <input type="passhttp://127.0.0.1:5500/login.htmlword" minlength="6" maxlength="15" style="width: 100%; padding: 5px; border: 1px solid white; border-radius: 5px; box-sizing: border-box;" required>
            </label>
        </div>
    </section>
    <section class="second">
        <div>
            <label class="check">
                <input type="checkbox"><p>Keep me looged in</p>
            </label>
        </div>
        <div class="forgot">
            <p><a href="#">Forgot password</a></p>
        </div>
    </section>
    <section class="third">
        <div>
            <button class="btn">
                <p>Log in</p>
            </button>
        </div>
    </section>
    <section class="fourth">
        <div id="ar">
            <p><a href="loginar.html">Arabic</a></p>
        </div>
        <div id="sp">
            <p><a href="loginsp.html">Spanish</a></p>
        </div>
    </section>
</body>
</html>
