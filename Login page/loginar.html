<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="./resources/css/style.css" rel="stylesheet">
    <title>صفحة تسجيل الدخول - ثلاموس</title>
</head>
<body>
    <header>
        <h1>مرحباً بك في <span>ثلاموس</span></h1>
    </header>
    <section class="first">
        <div>
            <label id="name">
                <p>اسم المستخدم أو البريد الإلكتروني</p>
                <input type="text" minlength="6" style="width: 100%; padding: 5px; border: 1px solid white; border-radius: 5px; box-sizing: border-box;" required>
            </label>
        </div>
        <div>
            <label id="pass">
                <p>كلمة المرور</p>
                <input type="password" minlength="6" maxlength="15" style="width: 100%; padding: 5px; border: 1px solid white; border-radius: 5px; box-sizing: border-box;" required>
            </label>
        </div>
    </section>
    <section class="second">
        <div>
            <label class="check">
                <input type="checkbox"><p>ابقني مسجلاً للدخول</p>
            </label>
        </div>
        <div class="forgot">
            <p><a href="#">نسيت كلمة المرور</a></p>
        </div>
    </section>
    <section class="third">
        <div>
            <button class="btn">
                <p><a href="#">تسجيل الدخول</a></p>
            </button>
        </div>
    </section>
    <section class="fourth">
        <div id="en">
            <p><a href="login.html">إنجليزي</a></p>
        </div>
        <div id="sp">
            <p><a href="loginsp.html">الأسبانية</a></p>
        </div>
    </section>
</body>
</html>
